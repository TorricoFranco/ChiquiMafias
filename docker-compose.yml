version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: football_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: football_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    container_name: football_backend
    build: ./backend
    restart: unless-stopped
    volumes: 
      - ./backend:/app
    ports:
      - "3007:3007"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://admin:admin123@postgres:5432/football_db

volumes:
  postgres_data:

