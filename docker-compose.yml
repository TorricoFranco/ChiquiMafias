version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

  postgres:
    image: postgres:15
    container_name: football_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    container_name: football_backend
    build: ./backend
    restart: unless-stopped
    ports:
      - "3007:3007"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:prod"
    environment:
      PORT: ${PORT}
      HOST: ${HOST}
      DATABASE_URL: ${DATABASE_URL}
      ID_LEAGUE_ARG: ${ID_LEAGUE_ARG}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      MERCADO_PAGO_API_URL: ${MERCADO_PAGO_API_URL}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN}
      MERCADO_PAGO_WEBHOOK_URL: ${MERCADO_PAGO_WEBHOOK_URL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      DISCORD_INTERNAL_SECRET: ${DISCORD_INTERNAL_SECRET}
      DISCORD_BOT_URL: ${DISCORD_BOT_URL}
      FRONTEND_SUCCESS_URL: ${FRONTEND_SUCCESS_URL}
      FRONTEND_FAILURE_URL: ${FRONTEND_FAILURE_URL}
      FRONTEND_PENDING_URL: ${FRONTEND_PENDING_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NODE_ENV: ${NODE_ENV}
      # Fijo: pisa cualquier valor del .env. dev-login y test-events nunca en prod.
      ENABLE_DEV_TOOLS: "false"


