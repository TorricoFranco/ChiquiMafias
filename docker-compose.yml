  new_frontend: 
    container_name: football_new_frontend
    build:
      context: ./new_frontend
      args:
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        - NEXT_PUBLIC_API_URL=${API_BACKEND_URL}
        - NEXT_PUBLIC_ARGENTINA_LEAGUE_ID=${NEXT_PUBLIC_ARGENTINA_LEAGUE_ID}
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      - PORT=${NEW_FRONTEND_PORT}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      - NEXT_PUBLIC_API_URL=${API_BACKEND_URL}
      - NEXT_PUBLIC_ARGENTINA_LEAGUE_ID=${NEXT_PUBLIC_ARGENTINA_LEAGUE_ID}
      - API_INTERNAL_URL=${API_INTERNAL_URL}
      - NODE_ENV=production
    depends_on:
      - backend


  discord_bot:
    container_name: football_discord_bot
    build: ./discord-bot
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_MODERATION_CHANNEL_ID: ${DISCORD_MODERATION_CHANNEL_ID}
      DISCORD_TICKETS_CHANNEL_ID: ${DISCORD_TICKETS_CHANNEL_ID}
      DISCORD_INTERNAL_SECRET: ${DISCORD_INTERNAL_SECRET}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      BACKEND_URL: "http://backend:3007" 
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
