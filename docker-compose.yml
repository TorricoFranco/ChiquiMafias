# Producción. Un solo punto de entrada público: Caddy (80/443).
# Todo lo demás vive en redes internas y no publica puertos en el host.
#
#   app  -> Caddy, frontend, backend y bot. Tiene salida a internet (Google, Mercado Pago, Discord...).
#   data -> Postgres, Redis y backend. `internal: true`: sin salida a internet ni acceso desde el host.
#
# Las variables salen del .env de esta carpeta (ver docs/DEPLOY.md). Para levantar:
#   docker compose up -d --build

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-chiquimafias.com}
      API_DOMAIN: ${API_DOMAIN:-api.chiquimafias.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      new_frontend:
        condition: service_healthy
    networks: [app]
    mem_limit: 128m
    logging: *default-logging

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [data]
    mem_limit: 768m
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # Redis guarda estado (saldos, apuestas en curso): sin maxmemory para que nunca desaloje claves.
    command: sh -c 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data]
    mem_limit: 512m
    logging: *default-logging

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Fijos: pisan cualquier valor del .env.
      NODE_ENV: production
      PORT: "3007"
      HOST: 0.0.0.0
      # dev-login y test-events nunca en prod.
      ENABLE_DEV_TOOLS: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    # El cliente de Prisma ya se generó en el build; acá solo se aplican las migraciones pendientes.
    command: sh -c "./node_modules/.bin/prisma migrate deploy && exec node dist/main"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3007/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [app, data]
    mem_limit: 768m
    logging: *default-logging

  new_frontend:
    build:
      context: ./new_frontend
      args:
        # Next.js hornea estos valores en el build: si cambian, hay que reconstruir la imagen.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_API_URL: ${API_BACKEND_URL}
        NEXT_PUBLIC_ARGENTINA_LEAGUE_ID: ${NEXT_PUBLIC_ARGENTINA_LEAGUE_ID}
    restart: unless-stopped
    environment:
      PORT: "3005"
      NODE_ENV: production
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3005/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [app]
    mem_limit: 512m
    logging: *default-logging

  discord_bot:
    build: ./discord-bot
    restart: unless-stopped
    environment:
      PORT: "3001"
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_MODERATION_CHANNEL_ID: ${DISCORD_MODERATION_CHANNEL_ID}
      DISCORD_TICKETS_CHANNEL_ID: ${DISCORD_TICKETS_CHANNEL_ID}
      DISCORD_INTERNAL_SECRET: ${DISCORD_INTERNAL_SECRET}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      BACKEND_URL: http://backend:3007
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3001 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [app]
    mem_limit: 256m
    logging: *default-logging

networks:
  app:
  data:
    internal: true

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
