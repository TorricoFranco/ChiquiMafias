version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    env_file:
      - .env.dev
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

  postgres:
    image: postgres:15
    container_name: football_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    env_file:
      - .env.dev
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    container_name: football_backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes: 
      - ./backend:/app
      - /app/node_modules
      - /app/dist
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3007:3007"
    env_file:         
      - .env.dev
    depends_on:
      - postgres
      - redis
    command: sh -c "npx prisma generate && npm run start:dev"
    environment:
      PORT: ${PORT}
      HOST: ${HOST}
      DATABASE_URL: ${DATABASE_URL}
      ID_LEAGUE_ARG: ${ID_LEAGUE_ARG}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      MERCADO_PAGO_API_URL: ${MERCADO_PAGO_API_URL}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN}
      MERCADO_PAGO_WEBHOOK_URL: ${MERCADO_PAGO_WEBHOOK_URL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      DISCORD_INTERNAL_SECRET: ${DISCORD_INTERNAL_SECRET}
      DISCORD_BOT_URL: ${DISCORD_BOT_URL}
      FRONTEND_SUCCESS_URL: ${FRONTEND_SUCCESS_URL}
      FRONTEND_FAILURE_URL: ${FRONTEND_FAILURE_URL}
      FRONTEND_PENDING_URL: ${FRONTEND_PENDING_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TESTCONTAINERS_RYUK_DISABLED: 'true'
      DOCKER_HOST: 'unix:///var/run/docker.sock'
      NODE_ENV: ${NODE_ENV}

  frontend:
    container_name: football_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        - NEXT_PUBLIC_API_URL=${API_BACKEND_URL}
        - NEXT_PUBLIC_ARGENTINA_LEAGUE_ID=${NEXT_PUBLIC_ARGENTINA_LEAGUE_ID}
        - API_INTERNAL_URL=${API_INTERNAL_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    env_file:
      - .env.dev
    environment:
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      - NEXT_PUBLIC_API_URL=${API_BACKEND_URL}
      - NEXT_PUBLIC_ARGENTINA_LEAGUE_ID=${NEXT_PUBLIC_ARGENTINA_LEAGUE_ID}
      - API_INTERNAL_URL=${API_INTERNAL_URL}
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  new_frontend:
    container_name: football_new_frontend
    build:
      context: ./new_frontend
      dockerfile: Dockerfile.dev
      args:
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        - NEXT_PUBLIC_API_URL=http://localhost:3007
        - NEXT_PUBLIC_ARGENTINA_LEAGUE_ID=${NEXT_PUBLIC_ARGENTINA_LEAGUE_ID}
    volumes:
      - ./new_frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3005:3005"
    env_file:
      - .env.dev 
    environment:
      - PORT=${NEW_FRONTEND_PORT}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID} 
      - NEXT_PUBLIC_API_URL=http://localhost:3007
      - NEXT_PUBLIC_ARGENTINA_LEAGUE_ID=${NEXT_PUBLIC_ARGENTINA_LEAGUE_ID}
      - API_INTERNAL_URL=${API_INTERNAL_URL}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NEXT_TURBOPACK_WATCH_POLLING=true
    depends_on:
      - backend
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "backend:3007"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    env_file:
      - .env.dev
    depends_on:
      - backend

  discord_bot:
    container_name: football_discord_bot
    build:
      context: ./discord-bot
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./discord-bot:/app
      - /app/node_modules
      - /app/dist
    ports:
      - "3001:3001"
    env_file:
      - .env.dev
    environment:
      PORT: 3001
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_MODERATION_CHANNEL_ID: ${DISCORD_MODERATION_CHANNEL_ID}
      DISCORD_TICKETS_CHANNEL_ID: ${DISCORD_TICKETS_CHANNEL_ID}
      DISCORD_INTERNAL_SECRET: ${DISCORD_INTERNAL_SECRET}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      BACKEND_URL: "http://backend:3007"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data: