name: Frontend (new_frontend)

on:
  push:
    branches: [ develop, main ]
    paths:
      - 'new_frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'new_frontend/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./new_frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: new_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # El resto del código todavía tiene errores de lint previos: por ahora solo se exige en los tests.
      - name: Lint (e2e)
        run: npx eslint e2e playwright.config.ts

      - name: Typecheck (e2e)
        run: npm run typecheck:e2e

      # Los tests mockean la API en http://localhost:3007; el build fija las NEXT_PUBLIC_* con esos valores.
      - name: Build
        run: npm run build:e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Con CI=true, playwright.config.ts levanta `npm run start:e2e` (build de producción en :3100).
      - name: E2E (mocked, desktop + mobile)
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: new_frontend/playwright-report/
          retention-days: 14
